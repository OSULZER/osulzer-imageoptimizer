[package]
name = "osulzer-imageoptimizer"
version = "1.1.0"
description = "Make photos web-ready: resize, compress, rename and tag them with SEO texts"
license-file = "LICENSE"
repository = "https://github.com/OSULZER/osulzer-imageoptimizer"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0.0"
ed25519-dalek = "3"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "wayland", "x11"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
getrandom = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "ico"] }
img-parts = "0.4.2"
interprocess = "2.4.9"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
mozjpeg = "0.10.13"
oxipng = { version = "10.2.1", default-features = false }
quantizr = "1.4.3"
rayon = "1.12.0"
rfd = "0.18.0"
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
trash = "5.4.0"
ureq = { version = "3.5.2", features = ["json"] }
webp = { version = "0.3.1", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
mslnk = "0.1"

[dev-dependencies]
kamadak-exif = "0.6.2"
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
